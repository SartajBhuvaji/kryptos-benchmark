[project]
name = "kryptos-benchmark"
version = "0.1.0"
description = "A contamination-resistant benchmark for evaluating LLMs on classical cryptanalysis, modelled on the Kryptos sculpture"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sartaj Bhuvaji", email = "sbhuvaj@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "datasets>=2.19",
    "huggingface-hub>=0.23",
]
# Running the benchmark against a model. Not needed to use the dataset.
eval = [
    "anthropic>=0.69",
    "datasets>=2.19",
    "rapidfuzz>=3.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The quadgram table is data the scoring module reads at runtime, so it has to travel
# with an installed package rather than only working from a source checkout.
"kryptos.scoring.data" = ["*.txt.gz", "PROVENANCE.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
